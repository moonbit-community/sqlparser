name: check

on:
  push:
    branches:
      - main   
  pull_request:

permissions:
  contents: read

env:
  MOON_WORK: "off"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "${{ matrix.toolchain }}"
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon update
        run: |
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: info check
        run: |
          moon info
          git diff --exit-code

      - name: Set ulimit
        run: |
          ulimit -s 8176

      - name: moon test
        run: |
          moon test --target all
          moon test --target all --release
